<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weiterleitung…</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin-top:3rem;color:#555;">
<div id="inhalt"><p>Einen Moment…</p></div>
<script>
  // Bewusst KEINE Navigation zu script.google.com (weder automatischer
  // Redirect noch anklickbarer Link): auf manchen Handys fängt das
  // Betriebssystem jede echte Navigation dorthin ab und versucht, sie als
  // Google-Drive-Datei zu öffnen ("Impossible d'ouvrir le fichier...").
  //
  // Stattdessen wird die Aktion per fetch() im Hintergrund ausgelöst — das
  // ist keine Seiten-Navigation, sondern nur ein HTTP-Request aus dem
  // JavaScript heraus, den das Betriebssystem nicht abfangen kann.
  //
  // Wichtig: mode "no-cors", weil Apps Script keine CORS-Freigabe für die
  // Antwort setzt — ohne "no-cors" blockiert der Browser den gesamten
  // Request mit einem Verbindungsfehler. Mit "no-cors" wird die Anfrage
  // trotzdem zuverlässig an Apps Script gesendet und dort verarbeitet
  // (Kalender-Eintrag umbenennen/löschen + Mail an den Gast); wir können nur
  // die Antwort selbst nicht mehr auslesen/anzeigen, deshalb zeigen wir hier
  // eine eigene, dazu passende Bestätigung an.
  const params = new URLSearchParams(window.location.search);
  const ziel = params.get("ziel");
  const inhalt = document.getElementById("inhalt");

  function meldungFuerAktion(url) {
    try {
      const aktion = new URL(url).searchParams.get("action");
      if (aktion === "zusagen") return "Die Buchung wurde bestätigt.";
      if (aktion === "ablehnen") return "Die Anfrage wurde abgelehnt.";
    } catch (err) {}
    return "Die Anfrage wurde verarbeitet.";
  }

  async function verarbeiten(url) {
    try {
      await fetch(url, { mode: "no-cors" });
      inhalt.innerHTML =
        `<p><strong>${meldungFuerAktion(url)}</strong></p>` +
        `<p style="font-size:0.85em;">Die Antwort-Mail wurde automatisch an den Gast verschickt.</p>`;
    } catch (err) {
      inhalt.innerHTML =
        "<p>Die Anfrage konnte nicht verarbeitet werden (Verbindungsfehler). " +
        "Bitte die Seite nochmal laden oder Nicu Bescheid geben.</p>";
    }
  }

  if (ziel) {
    verarbeiten(ziel);
  } else {
    inhalt.innerHTML = "<p>Kein Ziel angegeben.</p>";
  }
</script>
</body>
</html>
