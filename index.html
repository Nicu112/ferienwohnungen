<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferienwohnungen — Testversion</title>
<!-- Zugangscode-Sperre: läuft synchron vor dem ersten Rendern, damit der
     Seiteninhalt nicht kurz aufblitzt, bevor er ausgeblendet wird. Der
     eigentliche Eingabe-Dialog kommt aus js/zugangscode.js. -->
<script>
(function () {
  try {
    if (localStorage.getItem("ferienwohnungen-zugang") === "ok") return;
  } catch (err) {}
  document.documentElement.classList.add("zugang-gesperrt");
})();
</script>
<style>
html.zugang-gesperrt body > *:not(.zugang-overlay) { display: none !important; }
</style>
<link rel="stylesheet" href="css/style.css?t=20260830e">
</head>
<body>
<script src="js/zugangscode.js?t=20260823"></script>

<nav class="sprachumschalter" aria-label="Sprache">
<button type="button" data-lang="de">DE</button>
<button type="button" data-lang="fr">FR</button>
</nav>
</header>
<nav class="tabs">
<button type="button" class="tab-button active" data-tab="haus1"></button>
<button type="button" class="tab-button" data-tab="haus2"></button>
<button type="button" class="tab-button" data-tab="haus3"></button>
</nav>
<main>
<section class="haus-panel" data-haus="haus1">
